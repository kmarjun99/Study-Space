services:
  # Backend API Service
  - type: web
    name: studyspace-backend
    runtime: python
    region: singapore  # Change to oregon/frankfurt if needed
    plan: starter  # $7/month - Includes 512MB RAM, no sleep
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && chmod +x entrypoint.sh && ./entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    
    envVars:
      # Database (from Render PostgreSQL database below)
      - key: DATABASE_URL
        fromDatabase:
          name: studyspace-db
          property: connectionString
      
      # Security
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      
      # Redis (Optional - from Render Redis)
      - key: REDIS_URL
        sync: false
      
      # Email Configuration (Set in Render Dashboard)
      - key: mail_username
        sync: false
      - key: mail_password
        sync: false
      - key: mail_from
        value: StudySpace <noreply@studyspaceapp.in>
      - key: mail_server
        value: smtp.gmail.com
      - key: mail_port
        value: "587"
      
      # Razorpay Payment
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: studyspace-frontend
    runtime: static
    region: singapore
    plan: free  # Free tier
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    
    # Important: SPA routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    envVars:
      # Backend API URL - will be auto-populated after backend is deployed
      - key: VITE_API_BASE_URL
        value: https://studyspace-backend.onrender.com
    
    autoDeploy: true

# Managed PostgreSQL Database
databases:
  - name: studyspace-db
    databaseName: studyspace
    user: studyspace_user
    plan: starter  # $7/month - 256MB RAM, 1GB storage
    region: singapore
    ipAllowList: []  # Empty = allow from Render services only
