<!DOCTYPE html>
<html>
<head>
    <title>Fix Blob Ad Images</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1f2937;
            margin-top: 0;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #4338ca;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        pre {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔧 Fix Blob Ad Images</h1>
        
        <div class="info">
            <strong>📌 Quick Fix Tool</strong><br>
            This tool will call your backend API to replace all blob URLs in ads with proper placeholder images.
        </div>

        <div class="input-group">
            <label>Backend API URL:</label>
            <input type="text" id="apiUrl" value="https://studyspace-backend.onrender.com" placeholder="https://your-backend.com">
        </div>

        <div class="input-group">
            <label>Your Email (Super Admin):</label>
            <input type="email" id="email" placeholder="admin@example.com">
        </div>

        <div class="input-group">
            <label>Your Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button onclick="fixBlobUrls()" id="fixBtn">Fix Blob URLs Now</button>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function fixBlobUrls() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('fixBtn');

            if (!apiUrl || !email || !password) {
                showResult('Please fill in all fields', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processing...';
            resultDiv.style.display = 'none';

            try {
                // Step 1: Login to get token
                console.log('Logging in...');
                const loginResponse = await fetch(`${apiUrl}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: email,
                        password: password
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error('Login failed. Check your email and password.');
                }

                const loginData = await loginResponse.json();
                const token = loginData.access_token;

                console.log('Login successful, fixing blob URLs...');

                // Step 2: Call fix-blob-urls endpoint
                const fixResponse = await fetch(`${apiUrl}/ads/fix-blob-urls`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!fixResponse.ok) {
                    const errorData = await fixResponse.json();
                    throw new Error(errorData.detail || 'Failed to fix blob URLs');
                }

                const result = await fixResponse.json();

                // Show success message
                let message = `<strong>✅ ${result.message}</strong><br><br>`;
                message += `Fixed ${result.fixed_count} ad(s).<br><br>`;
                
                if (result.ads_fixed && result.ads_fixed.length > 0) {
                    message += '<strong>Fixed Ads:</strong><br>';
                    result.ads_fixed.forEach(ad => {
                        message += `• ${ad.title}<br>`;
                    });
                    message += '<br>';
                }
                
                message += `<strong>Next Steps:</strong><br>`;
                message += `1. Refresh https://studyspaceapp.in<br>`;
                message += `2. Images will show as placeholders<br>`;
                message += `3. Edit each ad to add proper URLs from Imgur or Unsplash`;

                showResult(message, 'success');

            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Fix Blob URLs Now';
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
