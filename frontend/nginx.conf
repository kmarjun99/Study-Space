server {
    # Cloud Run injects $PORT and requires the container to bind to it. We
    # substitute ${PORT} at container start via envsubst in the Dockerfile
    # CMD (whitelisted to only $PORT — nginx vars like $uri are left alone).
    # 8080 is the Cloud Run default (unprivileged, no CAP_NET_BIND_SERVICE
    # needed); the previous hardcoded `listen 80;` worked only because the
    # cloudbuild.yaml deploy step explicitly passed --port=80, which is
    # fragile — privileged ports can fail to bind on tighter sandboxes.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cache static assets (but NOT index.html)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html - it contains references to versioned assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Runtime API configuration is regenerated on every container start.
    # Never cache it, otherwise a browser/CDN can retain an old backend URL.
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
